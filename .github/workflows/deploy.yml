name: Deploy

# Changes to documentation or agent rules alone leave the site as it is (ADR-053).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - '.claude/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Nothing is published when a unit test fails (ADR-075). Kept as short as it can be, minutes
      # being counted (ADR-053): the unit tests only, in this same job, on the same installation;
      # no type check, no lint, no end-to-end test. The generated files are made once for both steps.
      - run: npm run -s generate

      - run: npm test

      - uses: actions/configure-pages@v6

      - run: npm run build --ignore-scripts
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/

      # GitHub sometimes lists the package of the site a few seconds after it is sent: the first try
      # then finds none (L-196). One more try after a short wait, in this same job: re-running the
      # whole run would send the package twice, which deploy-pages refuses.
      - id: first-try
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.first-try.outcome == 'failure'
        run: sleep 30

      - id: second-try
        if: steps.first-try.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - id: deployment
        run: echo "page_url=${{ steps.first-try.outputs.page_url || steps.second-try.outputs.page_url }}" >> "$GITHUB_OUTPUT"
